<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte Kirafuda</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes holo{0%{background-position:0% 0%}100%{background-position:100% 100%}}
.holo{animation:holo 5s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){.holo{animation:none}}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; position: relative; font-family: Poppins, system-ui, sans-serif; color: #F2F2F0;">
  <div style="position: absolute; left: 0; top: 0; width: 250px; height: 350px; transform: scale({{echelle}}); transform-origin: 0 0; box-sizing: border-box; padding: 7px; border-radius: 16px; background: {{cadre}}; box-shadow: 0 18px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.22);">
    <div style="position: relative; width: 100%; height: 100%; box-sizing: border-box; border-radius: 11px; overflow: hidden; background: {{fond}}; box-shadow: {{filet}}; padding: 10px 11px 9px; display: flex; flex-direction: column; gap: 7px;">

      <!-- Filigrane de l'élément -->
      <svg width="170" height="170" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: -38px; bottom: -30px; opacity: 0.1;"><path d="{{glyphe}}"></path></svg>

      <!-- En-tête -->
      <div style="position: relative; display: flex; align-items: center; gap: 7px;">
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 8.5px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: #9A9EA7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{serie}}</div>
          <div style="font-size: 16px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{nom}}</div>
        </div>
        <div style="display: flex; align-items: baseline; gap: 2px;">
          <span style="font-size: 8.5px; font-weight: 600; color: #9A9EA7;">PV</span>
          <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em;">{{pv}}</span>
        </div>
        <span title="{{elementNom}}" style="width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: {{accent}}; box-shadow: 0 0 0 2px rgba(255,255,255,0.12), 0 4px 10px {{accent}}55;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{elementNom}}"><path d="{{glyphe}}"></path></svg>
        </span>
      </div>

      <!-- Illustration -->
      <div style="position: relative; height: 140px; flex: none; border-radius: 9px; overflow: hidden; background: {{illu}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 6px 14px rgba(0,0,0,0.35);">
        <svg viewBox="0 0 200 140" width="100%" height="100%" preserveAspectRatio="xMidYMax meet" aria-hidden="true" style="position: absolute; inset: 0;"><circle cx="100" cy="58" r="26" fill="rgba(255,255,255,0.10)"></circle><path d="M44 140c4-30 28-46 56-46s52 16 56 46z" fill="rgba(255,255,255,0.10)"></path></svg>
        <span style="position: absolute; right: 8px; top: 7px; font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.45);">Illustration</span>
        <sc-if value="{{holoIllu}}" hint-placeholder-val="{{ false }}">
          <div class="holo" style="position: absolute; inset: 0; background: linear-gradient(120deg, transparent 15%, rgba(255,95,200,0.45) 32%, rgba(108,203,255,0.45) 48%, rgba(169,242,106,0.4) 64%, transparent 82%); background-size: 260% 260%; mix-blend-mode: color-dodge;"></div>
        </sc-if>
      </div>

      <!-- Attaques -->
      <div style="position: relative; display: flex; flex-direction: column;">
        <sc-for list="{{attaques}}" as="a" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.08);">
            <div style="display: flex; gap: 3px; width: 38px; flex: none;">
              <sc-for list="{{a.pastilles}}" as="p" hint-placeholder-count="1">
                <span style="width: 10px; height: 10px; border-radius: 50%; background: {{p.c}}; box-shadow: inset 0 -1.5px 0 rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.15);"></span>
              </sc-for>
            </div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 12.5px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{a.nom}}</div>
              <sc-if value="{{a.aEffet}}" hint-placeholder-val="{{ false }}">
                <div style="font-size: 9.5px; color: #9A9EA7; line-height: 1.3;">{{a.effet}}</div>
              </sc-if>
            </div>
            <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em;">{{a.degats}}</div>
          </div>
        </sc-for>
      </div>

      <div style="flex: 1;"></div>

      <!-- Pied -->
      <div style="position: relative; display: flex; align-items: center; gap: 5px; font-size: 9.5px; color: #9A9EA7;">
        <sc-if value="{{aFaiblesse}}" hint-placeholder-val="{{ true }}">
          <span>Faiblesse</span>
          <span title="{{faibleNom}}" style="width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; background: {{faibleCouleur}};">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{faibleNom}}"><path d="{{faibleGlyphe}}"></path></svg>
          </span>
          <span style="color: #F2F2F0; font-weight: 600;">×2</span>
        </sc-if>
        <span style="flex: 1;"></span>
        <span style="font-variant-numeric: tabular-nums;">{{numero}}</span>
        <span style="color: #F2F2F0; font-size: 10px;">{{symbole}}</span>
        <span style="padding: 0 4px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.22); color: #F2F2F0; font-weight: 700; font-size: 9px; line-height: 14px;">{{rang}}</span>
      </div>

      <sc-if value="{{holoTotal}}" hint-placeholder-val="{{ false }}">
        <div class="holo" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(125deg, transparent 10%, rgba(255,95,200,0.28) 30%, rgba(108,203,255,0.3) 46%, rgba(169,242,106,0.26) 62%, transparent 85%); background-size: 280% 280%; mix-blend-mode: color-dodge;"></div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"personnage":{"editor":null},"rarete":{"editor":"enum","options":["commune","peu-commune","holo","holo-integrale"],"default":"commune"},"numero":{"editor":"text","default":"022/100"},"echelle":{"editor":"float","min":0.3,"max":2,"step":0.05,"default":1},"$preview":{"width":250,"height":350}}'>
class Component extends DCLogic {
  renderVals() {
    var E = {
      feu: { n: 'Feu', c: '#F06A3F', g: 'M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.3 3 2.5 3.5C11.5 9 11 6 12 3z' },
      eau: { n: 'Eau', c: '#3D8FE8', g: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z' },
      glace: { n: 'Glace', c: '#4FBFDB', g: 'M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9' },
      foudre: { n: 'Foudre', c: '#A56BEB', g: 'M13 3L5 13h6l-1 8 8-10h-6l1-8z' },
      vent: { n: 'Vent', c: '#2FB98E', g: 'M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h8' },
      terre: { n: 'Terre', c: '#C08443', g: 'M3 19L9 8l4 6 3-4 5 9z' },
      lumiere: { n: 'Lumière', c: '#E0AE22', g: 'M12 7a5 5 0 1 0 0 10a5 5 0 1 0 0-10zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4' },
      tenebres: { n: 'Ténèbres', c: '#8B6FE0', g: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z' },
      neutre: { n: 'Neutre', c: '#9A958A', g: 'M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16z' }
    };
    var FAIBLE = { feu: 'eau', eau: 'foudre', foudre: 'terre', terre: 'vent', vent: 'glace', glace: 'feu', lumiere: 'tenebres', tenebres: 'lumiere', neutre: null };
    var argent = 'linear-gradient(135deg, #EEF0F3 0%, #A3A8B1 22%, #F7F8FA 45%, #8D929B 68%, #E3E6EA 100%)';
    var R = {
      'commune': { s: '♦', cadre: 'linear-gradient(160deg, #3A3D44 0%, #23252A 100%)', teinte: '30', filet: false, holoIllu: false, holoTotal: false },
      'peu-commune': { s: '♦♦', cadre: 'linear-gradient(160deg, #4B4F58 0%, #2A2C31 100%)', teinte: '45', filet: true, holoIllu: false, holoTotal: false },
      'holo': { s: '♦♦♦', cadre: 'linear-gradient(160deg, #50545E 0%, #2A2C31 100%)', teinte: '50', filet: true, holoIllu: true, holoTotal: false },
      'holo-integrale': { s: '♦♦♦♦', cadre: argent, teinte: '55', filet: true, holoIllu: true, holoTotal: true }
    };
    var p = this.props.personnage || { nom: 'Himeno', serie: 'Chainsaw Man', rang: 'C', element: 'vent', pv: 60, attaques: [{ nom: 'Pas léger', cout: 1, degats: 20, effet: 'Esquive' }, { nom: 'Ouragan', cout: 3, degats: 120, effet: 'Recul 30' }] };
    var r = R[this.props.rarete] || R['commune'];
    var e = E[p.element] || E.neutre;
    var f = FAIBLE[p.element] ? E[FAIBLE[p.element]] : null;
    var k = this.props.echelle ?? 1;
    var effetTexte = function (x) {
      if (!x) return '';
      if (typeof x === 'string') return x;
      var noms = { soin: 'Soin', recul: 'Recul', esquive: 'Esquive', charge: 'Charge', 'perce-bouclier': 'Perce-bouclier' };
      return (noms[x.type] || x.type) + (x.valeur ? ' ' + x.valeur : '');
    };
    return {
      w: Math.round(250 * k), h: Math.round(350 * k), echelle: k,
      nom: p.nom, serie: p.serie, pv: p.pv, rang: p.rang,
      numero: this.props.numero ?? '022/100',
      symbole: r.s, cadre: r.cadre, holoIllu: r.holoIllu, holoTotal: r.holoTotal,
      accent: e.c, glyphe: e.g, elementNom: e.n,
      fond: 'radial-gradient(130% 60% at 0% 0%, ' + e.c + r.teinte + ' 0%, transparent 62%), radial-gradient(100% 55% at 100% 100%, ' + e.c + '22 0%, transparent 70%), repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 7px), #16171B',
      filet: r.filet ? 'inset 0 0 0 1px ' + e.c + '70' : 'inset 0 0 0 1px rgba(255,255,255,0.07)',
      illu: 'radial-gradient(70% 85% at 60% 30%, ' + e.c + '90 0%, ' + e.c + '26 45%, transparent 75%), linear-gradient(180deg, #26282E 0%, #141518 100%)',
      aFaiblesse: !!f, faibleNom: f ? f.n : '', faibleCouleur: f ? f.c : 'transparent', faibleGlyphe: f ? f.g : '',
      attaques: (p.attaques || []).map(function (a) {
        var t = effetTexte(a.effet);
        var pastilles = [];
        for (var i = 0; i < a.cout; i++) pastilles.push({ c: e.c });
        return { nom: a.nom, degats: a.degats, effet: t, aEffet: !!t, pastilles: pastilles };
      })
    };
  }
}
</script>
</body>
</html>
